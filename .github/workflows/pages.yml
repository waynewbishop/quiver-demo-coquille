name: Deploy Coquille site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The site is plain HTML, CSS and JS in Site/, published at the root as-is.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./Site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
